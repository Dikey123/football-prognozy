name: Сбор прогнозов с сайтов

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * *" # ежедневно в 12:00 по Москве (UTC+3)
  push:
    branches: [main]
    paths: ["collect_tips.py", ".github/workflows/tips.yml"]

permissions:
  contents: write

concurrency:
  group: source-tips
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать опубликованные прогнозы
        run: python collect_tips.py
      - name: Сохранить новые прогнозы
        run: |
          git config user.name "tips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Новых прогнозов нет"
          else
            git commit -m "auto: сбор прогнозов с сайтов"
            git push
          fi
