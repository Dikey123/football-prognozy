name: Автосбор базы (расписание, счёт, результаты)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */3 * * *"      # каждые 3 часа
  push:
    branches: [main]
    paths: ["fetch_base.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: base-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать базу (с записью)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DRY_RUN: "0"
        run: |
          set -o pipefail
          python fetch_base.py 2>&1 | tee fetch_out.txt
      - name: Закоммитить изменения
        run: |
          git config user.name "base-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json results.json scores_api.json fetch_log.txt fetch_out.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: обновление расписания/счёта/результатов"
          fi
          git push
