name: Автосбор базы (расписание, счёт, результаты)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */3 * * *"      # каждые 3 часа
  push:
    paths: ["fetch_base.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: base-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать базу (с записью)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DRY_RUN: "0"
        run: python fetch_base.py
      - name: Закоммитить изменения
        run: |
          git config user.name "base-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json results.json scores_api.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "auto: обновление расписания/счёта/результатов"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "retry $i"; sleep 5
            done
          fi
